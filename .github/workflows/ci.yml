name: ci
on:
  pull_request:
  push:
    branches: [main, "fm/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: CLI tests
        run: go test ./cmd/fm-steer
      - name: firstmate integration tests
        run: integrations/firstmate/install_test.sh
      - name: Portal tests
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix test
