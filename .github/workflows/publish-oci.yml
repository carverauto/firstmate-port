name: Publish OCI Images
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Optional extra tag (for example v0.1.0)
        required: false
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY || secrets.BUILDBUDDY_API_KEY }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY || 'ghcr.io' }}
      OCI_PROJECT: ${{ vars.OCI_PROJECT || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: "1.25.0"
      - name: Configure BuildBuddy remote
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=remote cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote
      - name: Login to the container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | docker login "${OCI_REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
      - name: Push portal image
        env:
          EXTRA_TAG: ${{ github.event.inputs.extra_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="${OCI_REGISTRY}/${OCI_PROJECT}/firstmate-port"
          tag="sha-$(git rev-parse --short HEAD)"
          echo "IMAGE_REPO=${repo}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${tag}" >> "${GITHUB_ENV}"
          bazel --output_base=/tmp/fm-fm-port/bazel run --config=remote //:portal_image_push -- --repository "${repo}" --tag "${tag}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            bazel --output_base=/tmp/fm-fm-port/bazel run --config=remote //:portal_image_push -- --repository "${repo}" --tag "${REF_NAME}"
          fi
          if [ -n "${EXTRA_TAG}" ]; then
            bazel --output_base=/tmp/fm-fm-port/bazel run --config=remote //:portal_image_push -- --repository "${repo}" --tag "${EXTRA_TAG}"
          fi
      - name: Verify pushed manifest
        run: |
          set -euo pipefail
          digest="$(docker manifest inspect "${IMAGE_REPO}:${IMAGE_TAG}" \
            | sha256sum | cut -d' ' -f1)"
          echo "manifest for ${IMAGE_REPO}:${IMAGE_TAG} resolved (body sha256:${digest})"
          docker manifest inspect "${IMAGE_REPO}:${IMAGE_TAG}" | head -40
