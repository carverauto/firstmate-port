name: Publish OCI Images
on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Optional extra tag (for example v0.1.0)
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY || secrets.BUILDBUDDY_API_KEY }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY || 'registry.example.com' }}
      OCI_PROJECT: ${{ vars.OCI_PROJECT || 'firstmate' }}
      OCI_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
      OCI_TOKEN: ${{ secrets.HARBOR_ROBOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: "1.25.0"
      - name: Configure BuildBuddy remote
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=remote cannot authenticate." >&2
            exit 1
          fi

          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > .bazelrc.remote
      - name: Login to Harbor
        if: ${{ env.OCI_USERNAME != '' && env.OCI_TOKEN != '' }}
        run: |
          echo "${OCI_TOKEN}" | docker login "${OCI_REGISTRY}" -u "${OCI_USERNAME}" --password-stdin
      - name: Push portal image
        env:
          EXTRA_TAG: ${{ github.event.inputs.extra_tag }}
        run: |
          set -euo pipefail
          repo="${OCI_REGISTRY}/${OCI_PROJECT}/firstmate-port"
          tag="sha-$(git rev-parse --short HEAD)"
          bazel --output_base=/tmp/fm-fm-port/bazel run --config=remote //:portal_image_push -- --repository "${repo}" --tag "${tag}"
          if [ -n "${EXTRA_TAG}" ]; then
            bazel --output_base=/tmp/fm-fm-port/bazel run --config=remote //:portal_image_push -- --repository "${repo}" --tag "${EXTRA_TAG}"
          fi
