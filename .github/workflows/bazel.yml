name: bazel
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY || secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: "1.25.0"
      - name: Configure BuildBuddy remote
        run: |
          set -euo pipefail

          if [ -z "${BUILDBUDDY_ORG_API_KEY:-}" ]; then
            echo "BUILDBUDDY_ORG_API_KEY is unavailable; --config=remote cannot authenticate." >&2
            exit 1
          fi

          umask 077
          cat <<'EOF' | sed 's/^ *//' > .bazelrc.remote
            build --bes_results_url=https://carverauto.buildbuddy.io/invocation/
            build --bes_backend=grpcs://carverauto.buildbuddy.io
            build --remote_cache=grpcs://cache-proxy.carverauto.dev:443
            build --remote_executor=grpcs://carverauto.buildbuddy.io
            build --remote_timeout=15m
            build --remote_download_minimal
          EOF
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" >> .bazelrc.remote
      - name: Bazel build CLI
        run: bazel --output_base=/tmp/fm-fm-port/bazel build --config=remote //:fm-steer
      - name: Bazel test Go
        run: bazel --output_base=/tmp/fm-fm-port/bazel test --config=remote //:fm-steer_test
