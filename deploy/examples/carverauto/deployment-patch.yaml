# Site identity for the portal container plus the ghcr pull secret.
# ghcr.io/carverauto/firstmate-port; the namespace pulls it with `ghcr-io-cred`
# (a docker-registry secret). Local sign-in (DEV_AUTH) and the bootstrap admin
# secret come from the OSS base manifests; no site email wall and no IdP are
# set here (fail-soft generic OIDC lands via the fm-port-auth-runtime lane;
# the site issuer example stays in carverauto.md only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstmate-port
  namespace: firstmate
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-io-cred
      containers:
        - name: hub
          imagePullPolicy: IfNotPresent
          env:
            - name: PHX_HOST
              value: firstmate.carverauto.dev
            - name: PUBLIC_URL
              value: https://firstmate.carverauto.dev
            # The public hostname this deployment answers interactions on. One
            # URL for every tenant - the payload names the Discord application
            # and the tenant that claimed it is the one whose key verifies it.
            # Listing it here confines it to POST /interactions. Discord public
            # keys are never environment values - see docs/credentials.md.
            - name: DISCORD_INTERACTIONS_HOSTS
              value: discord-firstmate.carverauto.dev
            - name: NATS_REPLICAS
              value: "3"
            - name: GITHUB_ORG
              value: carverauto
            # Cloudflare proxies this hostname and sets cf-connecting-ip to the
            # real client. Reading x-forwarded-for instead would mean trusting a
            # list a client can prepend entries to. Only correct because nothing
            # reaches the Gateway except through Cloudflare.
            - name: TRUST_FORWARDED_PROTO
              value: "true"
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            # Shown on the public /terms and /privacy pages that Discord's
            # Developer Portal links to. Point LEGAL_CONTACT_EMAIL at a mailbox
            # someone actually reads before submitting those URLs to Discord.
            - name: LEGAL_OPERATOR
              value: Carver Automotive
            - name: LEGAL_CONTACT_EMAIL
              value: privacy@carverauto.dev
