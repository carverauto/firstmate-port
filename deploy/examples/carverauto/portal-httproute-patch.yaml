# Portal is LAN-only: lan-edge/lan-shared-gateway, VIP 192.168.6.87.
# Never attach the portal hostname to a public VIP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firstmate
  namespace: firstmate
  annotations:
    external-dns.alpha.kubernetes.io/hostname: firstmate.carverauto.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lan-shared-gateway
      namespace: lan-edge
      sectionName: https-carverauto
  hostnames:
    - firstmate.carverauto.dev
