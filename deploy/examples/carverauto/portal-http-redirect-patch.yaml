# Plain HTTP on the portal hostname exists only to send browsers to HTTPS.
# HSTS from the app then keeps them there without a second round trip.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firstmate-http-redirect
  namespace: firstmate
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: serviceradar-shared-gateway
      namespace: serviceradar-system
      sectionName: http-carverauto
  hostnames:
    - firstmate.carverauto.dev
