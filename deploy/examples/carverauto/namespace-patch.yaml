# The public shared Gateway selects namespaces by label. The LAN Gateway label
# went away with the portal's move to the public hostname: nothing in this
# namespace routes through lan-edge any more, and a selector label that grants
# access no route uses is a door left open for no reason.
apiVersion: v1
kind: Namespace
metadata:
  name: firstmate
  labels:
    serviceradar.com/gateway-access: "true"
