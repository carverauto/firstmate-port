# LAN routes need carverauto.com/lan-gateway-access. Discord interactions stay
# on the public shared Gateway, which selects serviceradar.com/gateway-access.
apiVersion: v1
kind: Namespace
metadata:
  name: firstmate
  labels:
    carverauto.com/lan-gateway-access: "true"
    serviceradar.com/gateway-access: "true"
