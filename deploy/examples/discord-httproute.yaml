# Example only: public Discord interactions route for a private deployment.
# Copy into a GitOps overlay. The hostname below is an example, never a
# compiled-in default. Discord POSTs /interactions on this hostname; the
# Phoenix service verifies Ed25519 and publishes onto the tenant inbound
# stream. There is no Discord sidecar.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firstmate-discord-interactions
  namespace: firstmate
  labels:
    app.kubernetes.io/name: firstmate
  annotations:
    external-dns.alpha.kubernetes.io/hostname: discord-firstmate.carverauto.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - discord-firstmate.carverauto.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /interactions
      backendRefs:
        - name: firstmate-port
          port: 4000
