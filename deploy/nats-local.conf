# Single-node JetStream for docker compose. One account per tenant.
# Kubernetes uses a 3-replica cluster; see k8s/nats.yaml.
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
}

accounts: {
  LOCAL: {
    jetstream: enabled
    users: [
      { user: local, password: local }
    ]
  }
}
