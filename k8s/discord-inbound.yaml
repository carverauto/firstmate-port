apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstmate-discord-inbound
  namespace: firstmate
  labels:
    app: firstmate-discord-inbound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firstmate-discord-inbound
  template:
    metadata:
      labels:
        app: firstmate-discord-inbound
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discord-inbound
          image: firstmate-discord-inbound:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://firstmate-nats:4222
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firstmate-nats
                  key: token
            - name: NATS_STREAM
              value: local.inbound
            - name: NATS_SUBJECT
              value: local.discord.inbound
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firstmate-discord
                  key: bot-token
            - name: DISCORD_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: firstmate-discord
                  key: channel-id
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: firstmate-discord
                  key: guild-id
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
