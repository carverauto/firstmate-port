apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: firstmate
resources:
  - namespace.yaml
  - pg-cluster.yaml
  - nats.yaml
  - deployment.yaml
  - httproute.yaml
  - discord-inbound.yaml
  - discord-interactions.yaml
configMapGenerator:
  - name: firstmate-discord-interactions
    files:
      - server.py=../cmd/discord-interactions/server.py
    options:
      disableNameSuffixHash: true
images:
  - name: firstmate-port
    newTag: sha-pending
