apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firstmate
  namespace: firstmate
  labels:
    app.kubernetes.io/name: firstmate
  annotations:
    external-dns.alpha.kubernetes.io/hostname: firstmate.example.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - firstmate.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: firstmate-port
          port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firstmate-http-redirect
  namespace: firstmate
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - firstmate.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
